version: 2.1

jobs:
  test:
    docker:
      - image: mcr.microsoft.com/playwright:v1.62.1-jammy
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Run Playwright tests
          command: npx playwright test
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  test:
    jobs:
      - test
