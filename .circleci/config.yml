version: 2.1

jobs:
  test:
    parameters:
      tag:
        type: string
        description: "Test tag to filter by, e.g. @smoke"
      project_flag:
        type: string
        default: "--project=chromium"
        description: "Playwright --project flag(s). Empty string runs every configured browser project."
    docker:
      - image: mcr.microsoft.com/playwright:v1.62.1-jammy
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Run << parameters.tag >> tests
          command: npx playwright test --grep "<< parameters.tag >>" << parameters.project_flag >>
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: screenshots
          destination: screenshots

workflows:
  # Fast sanity check on every push to main.
  smoke-on-main:
    jobs:
      - test:
          name: smoke
          tag: "@smoke"
          filters:
            branches:
              only: main

  # Full cross-browser regression on any release branch (release or release/*).
  regression-on-release:
    jobs:
      - test:
          name: regression
          tag: "@regression"
          project_flag: ""
          filters:
            branches:
              only: /^release(\/.*)?$/

  # Core business-workflow check, once a week rather than on every push.
  critical-weekly:
    triggers:
      - schedule:
          # Every Monday at 06:00 UTC. Adjust to taste.
          cron: "0 6 * * 1"
          filters:
            branches:
              only: main
    jobs:
      - test:
          name: critical
          tag: "@critical"
