version: 2.1

jobs:
  test:
    parameters:
      tag:
        type: string
        description: "Test tag to filter by, e.g. @smoke"
      project_flag:
        type: string
        default: "--project=chromium"
        description: "Playwright --project flag(s). Empty string runs every configured browser project."
      parallelism:
        type: integer
        default: 1
        description: "Number of parallel containers to shard this job's tests across."
    docker:
      - image: mcr.microsoft.com/playwright:v1.62.1-jammy
    resource_class: medium
    parallelism: << parameters.parallelism >>
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-cache-v1-{{ checksum "package-lock.json" }}
            - npm-cache-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-cache-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          # CIRCLE_NODE_INDEX/CIRCLE_NODE_TOTAL are always set (0 and 1 when
          # parallelism isn't overridden), so --shard is always 1/1 — i.e. a
          # no-op — for jobs that don't opt into parallelism above.
          name: Run << parameters.tag >> tests
          command: npx playwright test --grep "<< parameters.tag >>" << parameters.project_flag >> --shard=$((CIRCLE_NODE_INDEX+1))/$CIRCLE_NODE_TOTAL
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: extent-report
          destination: extent-report

workflows:
  # Fast sanity check on every push to main.
  smoke-on-main:
    jobs:
      - test:
          name: smoke
          tag: "@smoke"
          filters:
            branches:
              only: main

  # Full cross-browser regression on any release branch (release or release/*).
  # One job per browser, run in parallel (no `requires` between them) instead
  # of all three sequentially in a single container. Each browser's own tests
  # are further split across 2 containers via CircleCI parallelism + Playwright
  # --shard, so a single release-branch push spins up 6 containers total.
  # Bump `parallelism` per job (independently, if one browser is slower) to
  # trade more concurrent containers for a shorter wall-clock time.
  regression-on-release:
    jobs:
      - test:
          name: regression-chromium
          tag: "@regression"
          project_flag: "--project=chromium"
          parallelism: 2
          filters:
            branches:
              only: /^release(\/.*)?$/
      - test:
          name: regression-firefox
          tag: "@regression"
          project_flag: "--project=firefox"
          parallelism: 2
          filters:
            branches:
              only: /^release(\/.*)?$/
      - test:
          name: regression-webkit
          tag: "@regression"
          project_flag: "--project=webkit"
          parallelism: 2
          filters:
            branches:
              only: /^release(\/.*)?$/

  # Core business-workflow check, once a week rather than on every push.
  critical-weekly:
    triggers:
      - schedule:
          # Every Monday at 06:00 UTC. Adjust to taste.
          cron: "0 6 * * 1"
          filters:
            branches:
              only: main
    jobs:
      - test:
          name: critical
          tag: "@critical"
